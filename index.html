<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SNAKE 67</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');

        :root {
            --bg-color: #f1c40f;
            --brand-red: #e74c3c;
            --dark-bg: #2c3e50;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: white;
            /* Evitar el scroll en móviles para que se sienta como App nativa */
            height: 100vh; 
            height: 100dvh;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* HEADER */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        h1.logo {
            margin: 0;
            font-size: 32px;
            font-weight: 800;
            color: var(--brand-red);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            letter-spacing: 2px;
        }

        .btn-settings {
            background: var(--dark-bg);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: opacity 0.3s;
        }

        /* SCORE BOARD */
        #score-board {
            display: flex;
            justify-content: space-evenly;
            background: var(--dark-bg);
            padding: 10px 10px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 5;
        }

        /* ÁREA DEL JUEGO */
        .game-area {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
            background: rgba(0,0,0,0.05); /* Ligeramente más oscuro el fondo del área */
        }

        canvas {
            background-color: #808080;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            /* Escalar dinámicamente manteniendo proporción perfecta cuadrada */
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            touch-action: none; /* Crucial para evitar rebotes de pantalla al tocar el mapa */
        }

        /* OVERLAYS (Game Over & Settings) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 100;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .overlay h2 {
            font-size: clamp(40px, 12vw, 64px);
            margin: 0 0 20px 0;
            color: var(--brand-red);
            text-shadow: 0 0 15px rgba(231, 76, 60, 0.8);
            text-transform: uppercase;
        }

        .btn-action {
            background: var(--brand-red);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
            cursor: pointer;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        /* SETTINGS MODAL */
        .settings-modal {
            background: var(--dark-bg);
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-sizing: border-box;
        }
        
        .settings-section h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: var(--bg-color);
            text-transform: uppercase;
        }

        .settings-options {
            display: flex;
            flex-direction: column; /* Apilados verticalmente como solicitaste */
            gap: 8px;
        }

        .setting-btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .setting-btn.active {
            background: var(--brand-red);
        }

        .close-settings {
            background: transparent;
            color: white;
            border: 2px solid white;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
        }

        /* CONTROLES ARCADE (Fijos abajo) */
        .arcade-area {
            padding: 15px 10px 30px 10px;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: 0 -5px 10px rgba(0,0,0,0.1);
        }

        .dir-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            width: 100%;
        }

        .dir-btn {
            background: var(--brand-red);
            color: white;
            border: 4px solid #c0392b;
            border-radius: 50%;
            width: 75px;
            height: 75px;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 #922b21;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.05s, box-shadow 0.05s;
        }

        .dir-btn:active, .dir-btn.pressed {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #922b21;
        }
    </style>
</head>
<body>
    
    <div class="top-bar">
        <h1 class="logo">SNAKE 67</h1>
        <button class="btn-settings" onclick="openSettings()">⚙️</button>
    </div>

    <div id="score-board">
        <span>Puntos: <span id="score">0</span></span>
        <span>Tiempo: <span id="timer">00:00</span></span>
        <span>Mejor: <span id="high-score">0</span></span>
    </div>

    <div class="game-area">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        
        <!-- Game Over -->
        <div class="overlay" id="game-over">
            <h2>mamaste</h2>
            <button class="btn-action" onclick="resetGame()">volver a mamar</button>
        </div>
        
        <!-- Menú de Ajustes -->
        <div class="overlay" id="settings-overlay">
            <div class="settings-modal">
                <div class="settings-section">
                    <h3>Velocidad</h3>
                    <div class="settings-options">
                        <button class="setting-btn speed-btn" id="btn-speed-slow" onclick="setSpeed('slow')">Lenta</button>
                        <button class="setting-btn speed-btn active" id="btn-speed-medium" onclick="setSpeed('medium')">Media</button>
                        <button class="setting-btn speed-btn" id="btn-speed-fast" onclick="setSpeed('fast')">Alta</button>
                    </div>
                </div>
                <div class="settings-section">
                    <h3>Tamaño del Mapa</h3>
                    <div class="settings-options">
                        <button class="setting-btn size-btn" id="btn-size-small" onclick="setSize('small')">Pequeño</button>
                        <button class="setting-btn size-btn active" id="btn-size-medium" onclick="setSize('medium')">Mediano</button>
                        <button class="setting-btn size-btn" id="btn-size-large" onclick="setSize('large')">Grande</button>
                    </div>
                </div>
                <button class="close-settings" onclick="closeSettings()">Guardar y Cerrar</button>
            </div>
        </div>
    </div>

    <div class="arcade-area">
        <button class="dir-btn up" onmousedown="processInput('ArrowUp', this)" ontouchstart="processInput('ArrowUp', this); event.preventDefault();">▲</button>
        <div class="dir-row">
            <button class="dir-btn left" onmousedown="processInput('ArrowLeft', this)" ontouchstart="processInput('ArrowLeft', this); event.preventDefault();">◀</button>
            <button class="dir-btn down" onmousedown="processInput('ArrowDown', this)" ontouchstart="processInput('ArrowDown', this); event.preventDefault();">▼</button>
            <button class="dir-btn right" onmousedown="processInput('ArrowRight', this)" ontouchstart="processInput('ArrowRight', this); event.preventDefault();">▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("high-score");
        const timerElement = document.getElementById("timer");
        const gameOverOverlay = document.getElementById("game-over");
        const settingsOverlay = document.getElementById("settings-overlay");

        const sizeSettings = {
            small: { tileCount: 20, tileSize: 30 },
            medium: { tileCount: 40, tileSize: 15 },
            large: { tileCount: 60, tileSize: 10 }
        };
        let currentSizeMode = 'medium';
        let tileCount = sizeSettings.medium.tileCount;
        let tileSize = sizeSettings.medium.tileSize;

        const speedSettings = {
            slow: 150,
            medium: 100,
            fast: 60
        };
        let currentSpeedMode = 'medium';
        let gameSpeedBase = speedSettings.medium;
        let gameSpeed = gameSpeedBase;
        
        let snake = [];
        let dx = 0;
        let dy = 0;
        let foodX = 0;
        let foodY = 0;
        let score = 0;
        let highScore = 0;
        
        let gameLoopTimeout;
        let gameOver = false;
        let gameStarted = false;
        let settingsOpen = false;
        
        let startTime = 0;
        let timerInterval = null;
        let elapsedTime = 0;
        let changingDirection = false; 

        function openSettings() {
            if (gameStarted && !gameOver) return; // Bloqueado al jugar
            settingsOverlay.classList.add('active');
            settingsOpen = true;
        }

        function closeSettings() {
            settingsOverlay.classList.remove('active');
            settingsOpen = false;
        }

        function updateHighScoreDisplay() {
            const key = `snakeHighScore_${currentSpeedMode}_${currentSizeMode}`;
            highScore = localStorage.getItem(key) || 0;
            highScoreElement.innerText = highScore;
        }

        function setSpeed(mode) {
            currentSpeedMode = mode;
            gameSpeedBase = speedSettings[mode];
            gameSpeed = gameSpeedBase;
            
            document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-speed-' + mode).classList.add('active');
            updateHighScoreDisplay();
        }

        function setSize(mode) {
            currentSizeMode = mode;
            tileCount = sizeSettings[mode].tileCount;
            tileSize = sizeSettings[mode].tileSize;
            
            document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-size-' + mode).classList.add('active');
            updateHighScoreDisplay();
            initGame(); 
        }

        function updateSettingsUI() {
            const isPlaying = gameStarted && !gameOver;
            const gearBtn = document.querySelector('.btn-settings');
            if (isPlaying) {
                gearBtn.style.opacity = '0.3';
                gearBtn.style.cursor = 'not-allowed';
            } else {
                gearBtn.style.opacity = '1';
                gearBtn.style.cursor = 'pointer';
            }
        }

        function updateTimer() {
            elapsedTime = Math.floor((Date.now() - startTime) / 1000);
            const m = String(Math.floor(elapsedTime / 60)).padStart(2, '0');
            const s = String(elapsedTime % 60).padStart(2, '0');
            timerElement.innerText = `${m}:${s}`;
        }

        function startTimer() {
            if (!timerInterval) {
                startTime = Date.now() - (elapsedTime * 1000);
                timerInterval = setInterval(updateTimer, 1000);
            }
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function resetTimer() {
            stopTimer();
            elapsedTime = 0;
            timerElement.innerText = "00:00";
        }

        function initGame() {
            snake = [{ x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2) }];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            gameOver = false;
            gameStarted = false;
            changingDirection = false;
            
            gameSpeed = gameSpeedBase; 
            
            gameOverOverlay.classList.remove('active');
            resetTimer();
            updateHighScoreDisplay();
            updateSettingsUI();
            
            placeFood();
            clearScreen();
            drawFood();
            drawSnake();
        }

        function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius)
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y)
                rot += step

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y)
                rot += step
            }
            ctx.lineTo(cx, cy - outerRadius)
            ctx.closePath();
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#f39c12';
            ctx.stroke();
            ctx.fillStyle = '#f1c40f'; 
            ctx.fill();
        }

        function placeFood() {
            let valid = false;
            while (!valid) {
                foodX = Math.floor(Math.random() * tileCount);
                foodY = Math.floor(Math.random() * tileCount);
                valid = true;
                for (let part of snake) {
                    if (part.x === foodX && part.y === foodY) {
                        valid = false;
                        break;
                    }
                }
            }
        }

        function gameLoop() {
            if (gameOver) return;

            changingDirection = false;
            changeSnakePosition();
            
            if (checkGameOver()) {
                handleGameOver();
                return;
            }
            
            clearScreen();
            checkFoodCollision();
            drawFood();
            drawSnake();

            gameLoopTimeout = setTimeout(gameLoop, gameSpeed);
        }

        function clearScreen() {
            ctx.fillStyle = "#808080"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = "#959595";
            ctx.lineWidth = 1;
            
            ctx.beginPath();
            for(let x = 0; x <= canvas.width; x += tileSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
            }
            for(let y = 0; y <= canvas.height; y += tileSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();
        }

        function drawSnake() {
            for (let i = 0; i < snake.length; i++) {
                let part = snake[i];
                ctx.fillStyle = i === 0 ? "#b30000" : "#ff3333"; 
                
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(part.x * tileSize, part.y * tileSize, tileSize - 1, tileSize - 1, 4);
                } else {
                    ctx.rect(part.x * tileSize, part.y * tileSize, tileSize - 1, tileSize - 1);
                }
                ctx.fill();
            }
        }

        function changeSnakePosition() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);
        }

        function checkFoodCollision() {
            if (foodX === snake[0].x && foodY === snake[0].y) {
                score++;
                scoreElement.innerText = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.innerText = highScore;
                    const key = `snakeHighScore_${currentSpeedMode}_${currentSizeMode}`;
                    localStorage.setItem(key, highScore);
                }
                
                gameSpeed = Math.max(30, gameSpeed - 2);
                placeFood();
            } else {
                snake.pop(); 
            }
        }

        function checkGameOver() {
            if (!gameStarted) return false;

            const head = snake[0];
            
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }
            
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            
            return false;
        }

        function handleGameOver() {
            gameOver = true;
            stopTimer();
            updateSettingsUI();
            gameOverOverlay.classList.add('active');
        }

        function resetGame() {
            clearTimeout(gameLoopTimeout);
            initGame();
        }

        function processInput(key, btnElem) {
            if (settingsOpen) return;
            if (changingDirection) return;

            // Feedback visual del botón si se presiona
            if (btnElem) {
                btnElem.classList.add('pressed');
                setTimeout(() => btnElem.classList.remove('pressed'), 100);
            }

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            let moved = false;
            if (key === 'ArrowUp' && !goingDown) {
                dy = -1; dx = 0; moved = true;
            } else if (key === 'ArrowDown' && !goingUp) {
                dy = 1; dx = 0; moved = true;
            } else if (key === 'ArrowLeft' && !goingRight) {
                dy = 0; dx = -1; moved = true;
            } else if (key === 'ArrowRight' && !goingLeft) {
                dy = 0; dx = 1; moved = true;
            }

            if (moved) {
                changingDirection = true;
                if (!gameStarted) {
                    gameStarted = true;
                    updateSettingsUI(); 
                    startTimer(); 
                    gameLoop();
                }
            }
        }

        document.body.addEventListener('keydown', (event) => {
            const key = event.key;
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(key)) {
                event.preventDefault();
                processInput(key, null);
            }
        });

        initGame();
    </script>
</body>
</html>
