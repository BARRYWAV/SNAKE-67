<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SNAKE 67</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');

        :root {
            --bg-color: #f1c40f;
            --brand-red: #e74c3c;
            --dark-bg: #2c3e50;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: white;
            height: 100dvh;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* HEADER & SCORES */
        .top-bar {
            background: var(--dark-bg);
            padding: 10px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 5;
        }

        h1.logo {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            color: var(--brand-red);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            letter-spacing: 2px;
        }

        #score-board {
            display: flex;
            justify-content: space-evenly;
            width: 100%;
            max-width: 500px;
            margin-top: 5px;
            font-size: 14px;
            font-weight: bold;
        }

        /* MAIN LAYOUT */
        .main-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
            align-items: center;
            padding: 10px;
            gap: 10px;
        }

        /* ÁREA DEL JUEGO */
        .game-area {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1 1 auto; /* Permite que el área se encoja o crezca */
            min-height: 0; /* Vital para evitar overflow vertical */
            width: 100%;
        }

        .canvas-container {
            position: relative;
            aspect-ratio: 1 / 1;
            max-height: 100%;
            max-width: 100%;
        }

        canvas {
            background-color: #808080;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none; /* Previene scroll táctil sobre el mapa */
        }

        /* PANEL INFERIOR / LATERAL */
        .controls-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            flex: 0 0 auto;
        }

        /* AJUSTES A LA VISTA (Para no usar menús) */
        .settings-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            background: rgba(0,0,0,0.1);
            padding: 10px;
            border-radius: 12px;
            box-sizing: border-box;
            gap: 10px;
        }
        
        .settings-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .settings-group h3 {
            margin: 0 0 5px 0;
            font-size: 12px;
            color: var(--dark-bg);
            text-transform: uppercase;
        }

        .settings-options {
            display: flex;
            gap: 5px;
            width: 100%;
        }

        .setting-btn {
            background: var(--dark-bg);
            color: white;
            border: none;
            padding: 6px 2px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
            transition: background 0.2s;
        }

        .setting-btn.active {
            background: var(--brand-red);
        }

        /* CONTROLES ARCADE */
        .arcade-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .dir-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .dir-btn {
            background: var(--brand-red);
            color: white;
            border: 3px solid #c0392b;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 0 #922b21;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .dir-btn:active, .dir-btn.pressed {
            transform: translateY(5px);
            box-shadow: 0 0px 0 #922b21;
        }

        /* OVERLAY (Game Over) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 100;
            border-radius: 8px;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .overlay h2 {
            font-size: 32px;
            margin: 0 0 20px 0;
            color: var(--brand-red);
            text-transform: uppercase;
        }

        .btn-action {
            background: var(--brand-red);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
        }

        /* DISEÑO RESPONSIVO PARA PC / PANTALLAS GRANDES */
        @media (min-width: 768px) {
            .top-bar {
                flex-direction: row;
                justify-content: space-between;
                padding: 15px 40px;
            }
            #score-board {
                width: auto;
                margin-top: 0;
                gap: 30px;
                font-size: 18px;
            }
            .main-container {
                flex-direction: row;
                justify-content: center;
                gap: 50px;
                padding: 20px;
            }
            .game-area {
                flex: 0 1 auto;
                height: 85vh; /* Usa máximo espacio vertical */
                width: auto;
            }
            .controls-panel {
                width: 350px;
                gap: 30px;
                justify-content: center;
            }
            .settings-bar {
                flex-direction: column;
                padding: 20px;
            }
            .setting-btn {
                padding: 10px;
                font-size: 14px;
            }
            .settings-group h3 {
                font-size: 16px;
                margin-bottom: 10px;
            }
            .arcade-area {
                gap: 15px;
            }
            .dir-btn {
                width: 80px;
                height: 80px;
                font-size: 36px;
            }
            .dir-row {
                gap: 30px;
            }
        }
    </style>
</head>
<body>
    
    <div class="top-bar">
        <h1 class="logo">SNAKE 67</h1>
        <div id="score-board">
            <span>Puntos: <span id="score">0</span></span>
            <span>Tiempo: <span id="timer">00:00</span></span>
            <span>Mejor: <span id="high-score">0</span></span>
        </div>
    </div>

    <div class="main-container">
        <!-- ÁREA DEL JUEGO -->
        <div class="game-area">
            <div class="canvas-container">
                <canvas id="gameCanvas" width="600" height="600"></canvas>
                
                <!-- Game Over -->
                <div class="overlay" id="game-over">
                    <h2>mamaste</h2>
                    <button class="btn-action" onclick="resetGame()">volver a mamar</button>
                </div>
            </div>
        </div>

        <!-- CONTROLES Y AJUSTES (A la vista) -->
        <div class="controls-panel">
            <div class="settings-bar">
                <div class="settings-group">
                    <h3>Velocidad</h3>
                    <div class="settings-options">
                        <button class="setting-btn speed-btn" id="btn-speed-slow" onclick="setSpeed('slow')">Lenta</button>
                        <button class="setting-btn speed-btn active" id="btn-speed-medium" onclick="setSpeed('medium')">Media</button>
                        <button class="setting-btn speed-btn" id="btn-speed-fast" onclick="setSpeed('fast')">Alta</button>
                    </div>
                </div>
                <div class="settings-group">
                    <h3>Mapa</h3>
                    <div class="settings-options">
                        <button class="setting-btn size-btn" id="btn-size-small" onclick="setSize('small')">Chico</button>
                        <button class="setting-btn size-btn active" id="btn-size-medium" onclick="setSize('medium')">Medio</button>
                        <button class="setting-btn size-btn" id="btn-size-large" onclick="setSize('large')">Grande</button>
                    </div>
                </div>
            </div>

            <div class="arcade-area">
                <button class="dir-btn up" onmousedown="processInput('ArrowUp', this)" ontouchstart="processInput('ArrowUp', this); event.preventDefault();">▲</button>
                <div class="dir-row">
                    <button class="dir-btn left" onmousedown="processInput('ArrowLeft', this)" ontouchstart="processInput('ArrowLeft', this); event.preventDefault();">◀</button>
                    <button class="dir-btn down" onmousedown="processInput('ArrowDown', this)" ontouchstart="processInput('ArrowDown', this); event.preventDefault();">▼</button>
                    <button class="dir-btn right" onmousedown="processInput('ArrowRight', this)" ontouchstart="processInput('ArrowRight', this); event.preventDefault();">▶</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("high-score");
        const timerElement = document.getElementById("timer");
        const gameOverOverlay = document.getElementById("game-over");

        const sizeSettings = {
            small: { tileCount: 20, tileSize: 30 },
            medium: { tileCount: 40, tileSize: 15 },
            large: { tileCount: 60, tileSize: 10 }
        };
        let currentSizeMode = 'medium';
        let tileCount = sizeSettings.medium.tileCount;
        let tileSize = sizeSettings.medium.tileSize;

        const speedSettings = {
            slow: 150,
            medium: 100,
            fast: 60
        };
        let currentSpeedMode = 'medium';
        let gameSpeedBase = speedSettings.medium;
        let gameSpeed = gameSpeedBase;
        
        let snake = [];
        let dx = 0;
        let dy = 0;
        let foodX = 0;
        let foodY = 0;
        let score = 0;
        let highScore = 0;
        
        let gameLoopTimeout;
        let gameOver = false;
        let gameStarted = false;
        
        let startTime = 0;
        let timerInterval = null;
        let elapsedTime = 0;
        let changingDirection = false; 

        function updateHighScoreDisplay() {
            const key = `snakeHighScore_${currentSpeedMode}_${currentSizeMode}`;
            highScore = localStorage.getItem(key) || 0;
            highScoreElement.innerText = highScore;
        }

        function setSpeed(mode) {
            if (gameStarted && !gameOver) return; // Bloqueado si está jugando
            currentSpeedMode = mode;
            gameSpeedBase = speedSettings[mode];
            gameSpeed = gameSpeedBase;
            
            document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-speed-' + mode).classList.add('active');
            updateHighScoreDisplay();
        }

        function setSize(mode) {
            if (gameStarted && !gameOver) return; // Bloqueado si está jugando
            currentSizeMode = mode;
            tileCount = sizeSettings[mode].tileCount;
            tileSize = sizeSettings[mode].tileSize;
            
            document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-size-' + mode).classList.add('active');
            updateHighScoreDisplay();
            initGame(); 
        }

        function updateSettingsUI() {
            const isPlaying = gameStarted && !gameOver;
            const buttons = document.querySelectorAll('.setting-btn');
            buttons.forEach(btn => {
                if (isPlaying) {
                    btn.style.opacity = '0.5';
                    btn.style.cursor = 'not-allowed';
                } else {
                    btn.style.opacity = '1';
                    btn.style.cursor = 'pointer';
                }
            });
        }

        function updateTimer() {
            elapsedTime = Math.floor((Date.now() - startTime) / 1000);
            const m = String(Math.floor(elapsedTime / 60)).padStart(2, '0');
            const s = String(elapsedTime % 60).padStart(2, '0');
            timerElement.innerText = `${m}:${s}`;
        }

        function startTimer() {
            if (!timerInterval) {
                startTime = Date.now() - (elapsedTime * 1000);
                timerInterval = setInterval(updateTimer, 1000);
            }
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function resetTimer() {
            stopTimer();
            elapsedTime = 0;
            timerElement.innerText = "00:00";
        }

        function initGame() {
            const startX = Math.floor(tileCount / 2);
            const startY = Math.floor(tileCount / 2);
            
            // Serpiente inicial de 3 bloques para que sea muy visible
            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY }
            ];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            gameOver = false;
            gameStarted = false;
            changingDirection = false;
            
            gameSpeed = gameSpeedBase; 
            
            gameOverOverlay.classList.remove('active');
            resetTimer();
            updateHighScoreDisplay();
            updateSettingsUI();
            
            placeFood();
            clearScreen();
            drawFood();
            drawSnake();
        }

        function placeFood() {
            let valid = false;
            while (!valid) {
                foodX = Math.floor(Math.random() * tileCount);
                foodY = Math.floor(Math.random() * tileCount);
                valid = true;
                for (let part of snake) {
                    if (part.x === foodX && part.y === foodY) {
                        valid = false;
                        break;
                    }
                }
            }
        }

        function gameLoop() {
            if (gameOver) return;

            changingDirection = false;
            changeSnakePosition();
            
            if (checkGameOver()) {
                handleGameOver();
                return;
            }
            
            clearScreen();
            checkFoodCollision();
            drawFood();
            drawSnake();

            gameLoopTimeout = setTimeout(gameLoop, gameSpeed);
        }

        function clearScreen() {
            ctx.fillStyle = "#808080"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = "#959595";
            ctx.lineWidth = 1;
            
            ctx.beginPath();
            for(let x = 0; x <= canvas.width; x += tileSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
            }
            for(let y = 0; y <= canvas.height; y += tileSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();
        }

        function drawSnake() {
            for (let i = 0; i < snake.length; i++) {
                let part = snake[i];
                ctx.fillStyle = i === 0 ? "#b30000" : "#ff3333"; 
                
                // fillRect asegura que siempre se dibuje bien en cualquier dispositivo
                ctx.fillRect(part.x * tileSize, part.y * tileSize, tileSize - 1, tileSize - 1);
            }
        }

        function drawFood() {
            ctx.fillStyle = "#f1c40f"; // Color de la comida
            ctx.fillRect(foodX * tileSize, foodY * tileSize, tileSize - 1, tileSize - 1);
        }

        function changeSnakePosition() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);
        }

        function checkFoodCollision() {
            if (foodX === snake[0].x && foodY === snake[0].y) {
                score++;
                scoreElement.innerText = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.innerText = highScore;
                    const key = `snakeHighScore_${currentSpeedMode}_${currentSizeMode}`;
                    localStorage.setItem(key, highScore);
                }
                
                gameSpeed = Math.max(30, gameSpeed - 2);
                placeFood();
            } else {
                snake.pop(); 
            }
        }

        function checkGameOver() {
            if (!gameStarted) return false;

            const head = snake[0];
            
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }
            
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            
            return false;
        }

        function handleGameOver() {
            gameOver = true;
            stopTimer();
            updateSettingsUI();
            gameOverOverlay.classList.add('active');
        }

        function resetGame() {
            clearTimeout(gameLoopTimeout);
            initGame();
        }

        function processInput(key, btnElem) {
            if (changingDirection) return;

            // Feedback visual
            if (btnElem) {
                btnElem.classList.add('pressed');
                setTimeout(() => btnElem.classList.remove('pressed'), 100);
            }

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            let moved = false;
            
            // Si el juego no ha empezado, obligamos a que se mueva hacia donde apuntan si es válido
            if (!gameStarted) {
                if (key === 'ArrowUp') { dy = -1; dx = 0; moved = true; }
                else if (key === 'ArrowDown') { dy = 1; dx = 0; moved = true; }
                else if (key === 'ArrowLeft') { dy = 0; dx = -1; moved = true; }
                else if (key === 'ArrowRight') { dy = 0; dx = 1; moved = true; }
            } else {
                if (key === 'ArrowUp' && !goingDown) { dy = -1; dx = 0; moved = true; }
                else if (key === 'ArrowDown' && !goingUp) { dy = 1; dx = 0; moved = true; }
                else if (key === 'ArrowLeft' && !goingRight) { dy = 0; dx = -1; moved = true; }
                else if (key === 'ArrowRight' && !goingLeft) { dy = 0; dx = 1; moved = true; }
            }

            if (moved) {
                changingDirection = true;
                if (!gameStarted) {
                    gameStarted = true;
                    updateSettingsUI(); 
                    startTimer(); 
                    gameLoop();
                }
            }
        }

        document.body.addEventListener('keydown', (event) => {
            const key = event.key;
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(key)) {
                event.preventDefault();
                processInput(key, null);
            }
        });

        initGame();
    </script>
</body>
</html>
