<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE 67</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .main-layout {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        .game-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1.logo {
            margin: 0 0 15px 0;
            font-size: 56px;
            font-weight: 800;
            text-transform: uppercase;
            background: linear-gradient(to right, #f39c12, #ff4757);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.3);
            letter-spacing: 3px;
        }

        .game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 12px;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        canvas {
            background-color: #808080; /* Piso gris */
            border-radius: 8px;
            display: block;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        #score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
        }

        .score-box {
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-width: 90px;
            text-align: center;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .overlay h2 {
            font-size: 64px;
            margin: 0 0 30px 0;
            color: #ff4757;
            text-shadow: 0 0 20px rgba(255,71,87,0.8);
            text-transform: uppercase;
        }

        .btn-action {
            background: #ff4757;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 6px 20px rgba(255,71,87,0.5);
        }

        .btn-action:hover {
            transform: scale(1.05);
            background: #ff6b81;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .controls-hint {
            margin-top: 20px;
            font-size: 15px;
            color: rgba(255,255,255,0.8);
        }

        /* Sidebar styles */
        .sidebar-column {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 20px;
        }

        .settings-panel {
            background: rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .settings-panel h3 {
            margin: 0 0 20px 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #f1c40f;
        }

        .settings-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .setting-btn {
            background: rgba(0,0,0,0.4);
            color: white;
            border: 2px solid transparent;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .setting-btn:hover:not(.disabled) {
            background: rgba(255,255,255,0.1);
        }

        .setting-btn.active {
            background: #f39c12;
            color: #1f1c2c;
            border-color: #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.4);
        }

        .setting-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <div class="game-column">
            <h1 class="logo">SNAKE 67</h1>
            
            <div class="game-container">
                <div id="score-board">
                    <div class="score-box">Puntos: <span id="score">0</span></div>
                    <div class="score-box">Tiempo: <span id="timer">00:00</span></div>
                    <div class="score-box">Mejor: <span id="high-score">0</span></div>
                </div>
                <!-- Canvas fijo de 600x600, los casilleros cambian según el tamaño elegido -->
                <canvas id="gameCanvas" width="600" height="600"></canvas>
                <div class="overlay" id="game-over">
                    <h2>mamaste</h2>
                    <button class="btn-action" onclick="resetGame()">volver a mamar</button>
                </div>
            </div>

            <div class="controls-hint">Usa las flechas del teclado para jugar</div>
        </div>

        <div class="sidebar-column">
            <div class="settings-panel">
                <h3>Velocidad</h3>
                <div class="settings-options">
                    <button class="setting-btn speed-btn" id="btn-speed-slow" onclick="setSpeed('slow')">Lenta</button>
                    <button class="setting-btn speed-btn active" id="btn-speed-medium" onclick="setSpeed('medium')">Media</button>
                    <button class="setting-btn speed-btn" id="btn-speed-fast" onclick="setSpeed('fast')">Alta</button>
                </div>
            </div>

            <div class="settings-panel">
                <h3>Mapa</h3>
                <div class="settings-options">
                    <button class="setting-btn size-btn" id="btn-size-small" onclick="setSize('small')">Pequeño</button>
                    <button class="setting-btn size-btn active" id="btn-size-medium" onclick="setSize('medium')">Mediano</button>
                    <button class="setting-btn size-btn" id="btn-size-large" onclick="setSize('large')">Grande</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("high-score");
        const timerElement = document.getElementById("timer");
        const gameOverOverlay = document.getElementById("game-over");

        // Configuraciones de tamaño del mapa
        const sizeSettings = {
            small: { tileCount: 20, tileSize: 30 },
            medium: { tileCount: 40, tileSize: 15 },
            large: { tileCount: 60, tileSize: 10 }
        };
        let currentSizeMode = 'medium';
        let tileCount = sizeSettings.medium.tileCount;
        let tileSize = sizeSettings.medium.tileSize;

        // Configuraciones de velocidad
        const speedSettings = {
            slow: 150,
            medium: 100,
            fast: 60
        };
        let currentSpeedMode = 'medium';
        let gameSpeedBase = speedSettings.medium;
        let gameSpeed = gameSpeedBase;
        
        let snake = [];
        let dx = 0;
        let dy = 0;
        let foodX = 0;
        let foodY = 0;
        let score = 0;
        let highScore = 0;
        
        let gameLoopTimeout;
        let gameOver = false;
        let gameStarted = false;
        
        // Variables para el cronómetro
        let startTime = 0;
        let timerInterval = null;
        let elapsedTime = 0;

        // Evitar cambios rápidos de dirección
        let changingDirection = false; 

        function updateHighScoreDisplay() {
            const key = `snakeHighScore_${currentSpeedMode}_${currentSizeMode}`;
            highScore = localStorage.getItem(key) || 0;
            highScoreElement.innerText = highScore;
        }

        function setSpeed(mode) {
            if (gameStarted && !gameOver) return; // Bloqueado mientras juegas
            
            currentSpeedMode = mode;
            gameSpeedBase = speedSettings[mode];
            gameSpeed = gameSpeedBase;
            
            document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-speed-' + mode).classList.add('active');
            updateHighScoreDisplay();
        }

        function setSize(mode) {
            if (gameStarted && !gameOver) return; // Bloqueado mientras juegas
            
            currentSizeMode = mode;
            tileCount = sizeSettings[mode].tileCount;
            tileSize = sizeSettings[mode].tileSize;
            
            document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-size-' + mode).classList.add('active');
            updateHighScoreDisplay();
            initGame(); // Reinicia el mapa para ver los cambios
        }

        function updateSettingsUI() {
            const isPlaying = gameStarted && !gameOver;
            document.querySelectorAll('.setting-btn').forEach(btn => {
                if (isPlaying) btn.classList.add('disabled');
                else btn.classList.remove('disabled');
            });
        }

        function updateTimer() {
            elapsedTime = Math.floor((Date.now() - startTime) / 1000);
            const m = String(Math.floor(elapsedTime / 60)).padStart(2, '0');
            const s = String(elapsedTime % 60).padStart(2, '0');
            timerElement.innerText = `${m}:${s}`;
        }

        function startTimer() {
            if (!timerInterval) {
                startTime = Date.now() - (elapsedTime * 1000);
                timerInterval = setInterval(updateTimer, 1000);
            }
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function resetTimer() {
            stopTimer();
            elapsedTime = 0;
            timerElement.innerText = "00:00";
        }

        function initGame() {
            // Iniciar en el centro del mapa
            snake = [{ x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2) }];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            gameOver = false;
            gameStarted = false;
            changingDirection = false;
            
            gameSpeed = gameSpeedBase; 
            
            gameOverOverlay.classList.remove('active');
            resetTimer();
            updateHighScoreDisplay();
            updateSettingsUI();
            
            placeFood();
            clearScreen();
            drawFood();
            drawSnake();
        }

        function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius)
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y)
                rot += step

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y)
                rot += step
            }
            ctx.lineTo(cx, cy - outerRadius)
            ctx.closePath();
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#f39c12';
            ctx.stroke();
            ctx.fillStyle = '#f1c40f'; // Estrella amarilla
            ctx.fill();
        }

        function placeFood() {
            let valid = false;
            while (!valid) {
                foodX = Math.floor(Math.random() * tileCount);
                foodY = Math.floor(Math.random() * tileCount);
                valid = true;
                for (let part of snake) {
                    if (part.x === foodX && part.y === foodY) {
                        valid = false;
                        break;
                    }
                }
            }
        }

        function gameLoop() {
            if (gameOver) return;

            changingDirection = false;
            changeSnakePosition();
            
            if (checkGameOver()) {
                handleGameOver();
                return;
            }
            
            clearScreen();
            checkFoodCollision();
            drawFood();
            drawSnake();

            gameLoopTimeout = setTimeout(gameLoop, gameSpeed);
        }

        function clearScreen() {
            ctx.fillStyle = "#808080"; // Piso gris
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Dibujar cuadriculado para saber en qué cuadro exacto estás
            ctx.strokeStyle = "#959595"; // Gris un poco más claro
            ctx.lineWidth = 1;
            
            ctx.beginPath();
            for(let x = 0; x <= canvas.width; x += tileSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
            }
            for(let y = 0; y <= canvas.height; y += tileSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();
        }

        function drawSnake() {
            for (let i = 0; i < snake.length; i++) {
                let part = snake[i];
                // Cabeza un poco más oscura
                ctx.fillStyle = i === 0 ? "#b30000" : "#ff3333"; 
                
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(part.x * tileSize, part.y * tileSize, tileSize - 1, tileSize - 1, 4);
                } else {
                    ctx.rect(part.x * tileSize, part.y * tileSize, tileSize - 1, tileSize - 1);
                }
                ctx.fill();
            }
        }

        function changeSnakePosition() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);
        }

        function checkFoodCollision() {
            if (foodX === snake[0].x && foodY === snake[0].y) {
                score++;
                scoreElement.innerText = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.innerText = highScore;
                    const key = `snakeHighScore_${currentSpeedMode}_${currentSizeMode}`;
                    localStorage.setItem(key, highScore);
                }
                
                // Aumentar velocidad ligeramente al comer
                gameSpeed = Math.max(30, gameSpeed - 2);
                
                placeFood();
            } else {
                snake.pop(); 
            }
        }

        function drawFood() {
            const cx = foodX * tileSize + tileSize / 2;
            const cy = foodY * tileSize + tileSize / 2;
            drawStar(cx, cy, 5, tileSize / 2 - 1, tileSize / 4);
        }

        function checkGameOver() {
            if (!gameStarted) return false;

            const head = snake[0];
            
            // Choque con paredes
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }
            
            // Choque consigo misma
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            
            return false;
        }

        function handleGameOver() {
            gameOver = true;
            stopTimer();
            updateSettingsUI(); // Volver a habilitar botones de configuración
            gameOverOverlay.classList.add('active');
        }

        function resetGame() {
            clearTimeout(gameLoopTimeout);
            initGame();
        }

        document.body.addEventListener('keydown', (event) => {
            if (changingDirection) return;

            const key = event.key;
            
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(key)) {
                event.preventDefault();
            }

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            let moved = false;
            if (key === 'ArrowUp' && !goingDown) {
                dy = -1; dx = 0; moved = true;
            } else if (key === 'ArrowDown' && !goingUp) {
                dy = 1; dx = 0; moved = true;
            } else if (key === 'ArrowLeft' && !goingRight) {
                dy = 0; dx = -1; moved = true;
            } else if (key === 'ArrowRight' && !goingLeft) {
                dy = 0; dx = 1; moved = true;
            }

            if (moved) {
                changingDirection = true;
                if (!gameStarted) {
                    gameStarted = true;
                    updateSettingsUI(); // Bloquear botones de configuración
                    startTimer(); 
                    gameLoop();
                }
            }
        });

        initGame();
    </script>
</body>
</html>
