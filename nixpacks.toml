providers = ["python", "node"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.11"
NIXPACKS_NODE_VERSION = "22"

[phases.install]
cmds = [
    "python -m venv /opt/venv",
    ". /opt/venv/bin/activate && pip install -r backend/requirements.txt",
    "rm -rf frontend/node_modules frontend/package-lock.json",
    "npm install --prefix frontend --include=optional",
    "npm install --prefix frontend @rolldown/binding-linux-x64-gnu --no-save"
]

[phases.build]
cmds = [
    "npm run build --prefix frontend"
]

[start]
cmd = ". /opt/venv/bin/activate && cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
